<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Teardown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="stage" aria-label="3D model of a three-cylinder motorcycle"></canvas>

    <div id="loader" role="status">Loading</div>

    <main>
      <section class="s-hero">
        <div class="copy">
          <p class="eyebrow">Teardown</p>
          <h1>A three-cylinder naked bike, taken apart as you scroll.</h1>
          <p class="hint">Scroll</p>
        </div>
      </section>

      <section class="s-explode">
        <div class="copy">
          <h2>Every part moves straight out from the engine.</h2>
          <p><span data-count>0</span> parts, each pushed away from where it sits on the bike.</p>
        </div>
      </section>

      <section class="s-gap"></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
